name: Private species research queue

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vnmv1-species-research
  cancel-in-progress: false

jobs:
  research-next-queued-specimen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout public runner code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate research collector
        run: |
          set -euo pipefail
          python -m py_compile 02_SCRIPTS/TOOLS/vnmv1_species_research_v1.py
          PYTHONPATH=02_SCRIPTS/TOOLS python -m unittest discover -s 02_SCRIPTS/TESTS -p "test_vnmv1_species_research_v1.py" -v

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet -r requirements.txt

      - name: Build and save a private research packet
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.VNMV1_GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          RESEARCH_QUEUE_FILE_ID: ${{ secrets.VNMV1_RESEARCH_QUEUE_FILE_ID }}
          RESEARCH_OUTPUT_FOLDER_ID: ${{ secrets.VNMV1_RESEARCH_OUTPUT_FOLDER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$GDRIVE_SERVICE_ACCOUNT_JSON" || -z "$RESEARCH_QUEUE_FILE_ID" || -z "$RESEARCH_OUTPUT_FOLDER_ID" ]]; then
            echo "::warning::Research queue is not configured; no private Drive data was read."
            exit 0
          fi
          python 02_SCRIPTS/TOOLS/vnmv1_species_research_v1.py

      - name: Report run without private identifiers
        if: always()
        run: |
          {
            echo "## Species research queue"
            echo
            echo "Research packets stay in private Drive. Species names, card identifiers, image files, and packet contents are not published in this public repository."
            echo "ChatGPT must inspect the reference images and run ImageGen in a ChatGPT session."
          } >> "$GITHUB_STEP_SUMMARY"
