name: Private species research queue

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vnmv1-species-research
  cancel-in-progress: false

jobs:
  research-next-queued-specimen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check private queue configuration
        id: config
        env:
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.VNMV1_GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_CLIENT_ID: ${{ secrets.VNMV1_GOOGLE_DRIVE_OAUTH_CLIENT_ID }}
          DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.VNMV1_GOOGLE_DRIVE_OAUTH_CLIENT_SECRET }}
          DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.VNMV1_GOOGLE_DRIVE_OAUTH_REFRESH_TOKEN }}
          RESEARCH_QUEUE_FILE_ID: ${{ secrets.VNMV1_RESEARCH_QUEUE_FILE_ID }}
          RESEARCH_OUTPUT_FOLDER_ID: ${{ secrets.VNMV1_RESEARCH_OUTPUT_FOLDER_ID }}
        run: |
          oauth_configured=false
          if [[ -n "$DRIVE_OAUTH_CLIENT_ID" && -n "$DRIVE_OAUTH_CLIENT_SECRET" && -n "$DRIVE_OAUTH_REFRESH_TOKEN" ]]; then
            oauth_configured=true
          fi
          if [[ ( -z "$DRIVE_SERVICE_ACCOUNT_JSON" && "$oauth_configured" != "true" ) || -z "$RESEARCH_QUEUE_FILE_ID" || -z "$RESEARCH_OUTPUT_FOLDER_ID" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Private research queue is not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout public runner code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate research collector
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          python -m py_compile 02_SCRIPTS/TOOLS/vnmv1_species_research_v1.py
          PYTHONPATH=02_SCRIPTS/TOOLS python -m unittest discover -s 02_SCRIPTS/TESTS -p "test_vnmv1_species_research_v1.py" -v

      - name: Install dependencies
        if: steps.config.outputs.configured == 'true'
        run: python -m pip install --disable-pip-version-check --quiet -r requirements.txt

      - name: Build and save a private research packet
        if: steps.config.outputs.configured == 'true'
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.VNMV1_GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.VNMV1_GOOGLE_DRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.VNMV1_GOOGLE_DRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.VNMV1_GOOGLE_DRIVE_OAUTH_REFRESH_TOKEN }}
          RESEARCH_QUEUE_FILE_ID: ${{ secrets.VNMV1_RESEARCH_QUEUE_FILE_ID }}
          RESEARCH_OUTPUT_FOLDER_ID: ${{ secrets.VNMV1_RESEARCH_OUTPUT_FOLDER_ID }}
        run: python 02_SCRIPTS/TOOLS/vnmv1_species_research_v1.py

      - name: Report run without private identifiers
        if: always()
        run: |
          {
            echo "## Species research queue"
            echo
            echo "Research packets stay in private Drive. Species names, card identifiers, image files, and packet contents are not published in this public repository."
            echo "ChatGPT must inspect the reference images and run ImageGen in a ChatGPT session."
          } >> "$GITHUB_STEP_SUMMARY"
