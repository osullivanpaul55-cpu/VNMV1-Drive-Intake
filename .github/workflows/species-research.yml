name: Species research queue

on:
  push:
    paths:
      - ".github/workflows/species-research.yml"
      - "02_SCRIPTS/TOOLS/vnmv1_species_research_v1.py"
      - "02_SCRIPTS/TESTS/test_vnmv1_species_research_v1.py"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vnmv1-species-research
  cancel-in-progress: false

jobs:
  research-next-queued-specimen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check Drive queue configuration
        id: config
        env:
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.VNMV1_GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          RESEARCH_QUEUE_FILE_ID: ${{ secrets.VNMV1_RESEARCH_QUEUE_FILE_ID }}
          PACKET_DRIVE_FOLDER_ID: ${{ secrets.VNMV1_PACKET_DRIVE_FOLDER_ID }}
        run: |
          if [[ -z "$DRIVE_SERVICE_ACCOUNT_JSON" || -z "$RESEARCH_QUEUE_FILE_ID" || -z "$PACKET_DRIVE_FOLDER_ID" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Private Drive queue or image-packet destination is not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout runner and packet history
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.config.outputs.configured == 'true'
        run: python -m pip install --disable-pip-version-check --quiet -r requirements.txt

      - name: Validate research collector
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          python -m py_compile 02_SCRIPTS/TOOLS/vnmv1_species_research_v1.py
          PYTHONPATH=02_SCRIPTS/TOOLS python -m unittest discover -s 02_SCRIPTS/TESTS -p "test_vnmv1_species_research_v1.py" -v

      - name: Build the next research packet
        if: steps.config.outputs.configured == 'true'
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.VNMV1_GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          RESEARCH_QUEUE_FILE_ID: ${{ secrets.VNMV1_RESEARCH_QUEUE_FILE_ID }}
          VNMV1_PACKET_DRIVE_FOLDER_ID: ${{ secrets.VNMV1_PACKET_DRIVE_FOLDER_ID }}
        run: python 02_SCRIPTS/TOOLS/vnmv1_species_research_v1.py

      - name: Commit packet to public repository
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-output/*.json
          if git diff --cached --quiet; then
            echo "No new research packet to commit."
          else
            git commit -m "Add next species research packet"
            git push
          fi

      - name: Report packet destination
        if: always()
        run: |
          {
            echo "## Species research queue"
            echo
            echo "Image ZIP packets go to the configured private Drive folder; only research JSON metadata is committed here."
            echo "Each scheduled run processes at most one new card."
            echo "Packets target 14 bundled images and retain source links when images cannot be bundled. ChatGPT ImageGen still runs in a ChatGPT session."
          } >> "$GITHUB_STEP_SUMMARY"
