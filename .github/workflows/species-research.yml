name: Private species research queue

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vnmv1-species-research
  cancel-in-progress: false

jobs:
  research-next-queued-specimen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check private queue configuration
        id: config
        env:
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.VNMV1_GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          RESEARCH_QUEUE_FILE_ID: ${{ secrets.VNMV1_RESEARCH_QUEUE_FILE_ID }}
        run: |
          if [[ -z "$DRIVE_SERVICE_ACCOUNT_JSON" || -z "$RESEARCH_QUEUE_FILE_ID" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Private Drive queue is not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout public runner code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate research collector
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          python -m py_compile 02_SCRIPTS/TOOLS/vnmv1_species_research_v1.py
          PYTHONPATH=02_SCRIPTS/TOOLS python -m unittest discover -s 02_SCRIPTS/TESTS -p "test_vnmv1_species_research_v1.py" -v

      - name: Install dependencies
        if: steps.config.outputs.configured == 'true'
        run: python -m pip install --disable-pip-version-check --quiet -r requirements.txt

      - name: Research the next queued species
        id: research
        if: steps.config.outputs.configured == 'true'
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.VNMV1_GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          RESEARCH_QUEUE_FILE_ID: ${{ secrets.VNMV1_RESEARCH_QUEUE_FILE_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python 02_SCRIPTS/TOOLS/vnmv1_species_research_v1.py

      - name: Upload public research packet
        if: steps.config.outputs.configured == 'true' && steps.research.outputs.upload == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.research.outputs.artifact_name }}
          path: research-output/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Report run without private identifiers
        if: always()
        run: |
          {
            echo "## Species research queue"
            echo
            echo "The public artifact contains species research and source links. Queue/card request identifiers and image files are omitted. Anyone can download it; it expires after 90 days."
            echo "Reference photos still need visual review, and image generation must be run in a ChatGPT session."
          } >> "$GITHUB_STEP_SUMMARY"
