name: Private Drive image inbox check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      drive_folder_id:
        description: Optional Drive folder ID; defaults to VNMV1_IMAGEGEN_DRIVE_FOLDER_ID variable
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: vnmv1-drive-intake
  cancel-in-progress: false

jobs:
  check-private-drive-inbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public runner code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate source and filename rules
        run: |
          set -euo pipefail
          python -m py_compile 02_SCRIPTS/TOOLS/vnmv1_drive_candidate_intake_v1.py
          PYTHONPATH=02_SCRIPTS/TOOLS python -m unittest discover -s 02_SCRIPTS/TESTS -p "test_vnmv1_drive_candidate_intake_v1.py" -v

      - name: Restore private deduplication state
        uses: actions/cache@v4
        with:
          path: .cache/vnmv1-drive-intake/state.json
          key: vnmv1-drive-intake-${{ github.run_id }}
          restore-keys: |
            vnmv1-drive-intake-

      - name: Install Drive API dependencies
        run: python -m pip install --disable-pip-version-check --quiet -r requirements.txt

      - name: Read candidate files from private Drive
        id: intake
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.VNMV1_GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ inputs.drive_folder_id || vars.VNMV1_IMAGEGEN_DRIVE_FOLDER_ID }}
          RUN_DIR: controller-output/drive-intake/${{ github.run_id }}
          STATE_PATH: .cache/vnmv1-drive-intake/state.json
        run: |
          set -euo pipefail
          if [[ -z "$GDRIVE_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::warning::Drive check skipped: add VNMV1_GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON to this repository's Actions secrets."
            exit 0
          fi
          if [[ -z "$DRIVE_FOLDER_ID" ]]; then
            echo "::error::Set the VNMV1_IMAGEGEN_DRIVE_FOLDER_ID repository variable or provide the folder ID for a manual run."
            exit 2
          fi
          mkdir -p "$RUN_DIR" "$(dirname "$STATE_PATH")"
          python 02_SCRIPTS/TOOLS/vnmv1_drive_candidate_intake_v1.py --folder-id "$DRIVE_FOLDER_ID" --out "$RUN_DIR" --state "$STATE_PATH"
          NEW_FILES="$(python -c 'import json,os; print(len(json.load(open(os.path.join(os.environ["RUN_DIR"],"INTAKE_MANIFEST.json")))[ "records"]))')"
          echo "new_files=$NEW_FILES" >> "$GITHUB_OUTPUT"

      - name: Report scan without file details
        if: always()
        run: |
          {
            echo "## Drive inbox scan"
            echo
            echo "The run does not publish images, filenames, Drive IDs, manifests, or research data as repository files or artifacts."
            echo "Candidate images remain in Drive. Review them there with ChatGPT."
          } >> "$GITHUB_STEP_SUMMARY"
